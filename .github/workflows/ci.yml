name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run zip
      # upload-artifact@v4 uses @actions/glob, which honors .gitignore by
      # default — and .output/ is gitignored (build output). Stage the
      # zips into a non-ignored directory so the action can see them.
      - name: Stage zips for upload
        run: |
          mkdir -p artifacts
          cp .output/*.zip artifacts/
          ls -la artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: capsium-viewer-node${{ matrix.node }}
          path: artifacts/*.zip
          if-no-files-found: error
